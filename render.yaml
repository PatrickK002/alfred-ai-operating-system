services:
  - type: web
    runtime: node
    name: alfred-ai-operating-system
    repo: https://github.com/PatrickK002/alfred-ai-operating-system
    region: frankfurt
    plan: starter
    branch: develop
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: alfred-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: APP_BASE_URL
        value: https://alfred-ai-operating-system.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: AUTHENTICATION_ENABLED
        value: "true"
      - key: AUTHENTICATION_PROVIDER
        value: basic-auth
      - key: ALFRED_BASIC_AUTH_USERNAME
        sync: false
      - key: ALFRED_BASIC_AUTH_PASSWORD
        sync: false
      - key: ALFRED_ALLOWED_USERS
        sync: false
      - key: ALFRED_REQUIRE_USER_ALLOWLIST
        value: "true"
      - key: ALFRED_DB_PATH
        value: /var/data/alfred.db
      - key: ALFRED_BACKUP_DIR
        value: /var/data/backups
      - key: MICROSOFT_TOKEN_PATH
        value: /var/data/microsoft-token.json
      - key: ALFRED_BACKUP_STRATEGY
        value: render-persistent-disk-daily-snapshots
      - key: ALFRED_BACKUP_RETENTION_DAYS
        value: "14"
      - key: ALFRED_TEMPORARY_RENDER_KEY_REVOKED
        value: "true"
      - key: ENFORCE_HTTPS
        value: "true"
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: VOYAGE_MODEL
        value: voyage-4-lite
      - key: SEMANTIC_INDEXING_ENABLED
        value: "true"
      - key: MONDAY_API_VERSION
        value: "2025-04"
      - key: DEEPGRAM_MODEL
        value: nova-3
      - key: ELEVENLABS_MODEL
        value: eleven_turbo_v2_5
      - key: VOICE_ENABLED
        value: "true"
      - key: VOICE_TRANSCRIPT_LOGGING_ENABLED
        value: "true"
      - key: VOICE_TRANSCRIPT_RETENTION_DAYS
        value: "30"
