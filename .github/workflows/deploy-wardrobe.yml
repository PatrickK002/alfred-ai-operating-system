name: Deploy Wardrobe Stylist to GitHub Pages

# Builds the wardrobe-stylist app and publishes the static site to GitHub Pages.
# One-time setup: in the repo, Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". After that this workflow deploys automatically.
on:
  push:
    branches:
      - main
      - claude/app-build-objective-zm32ou
    paths:
      - "wardrobe-stylist/**"
      - ".github/workflows/deploy-wardrobe.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wardrobe-stylist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wardrobe-stylist/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wardrobe-stylist/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
