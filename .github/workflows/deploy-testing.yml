name: Deploy Testing

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_TESTING_WEBAPP_NAME }}
  AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_TESTING_PUBLISH_PROFILE }}
  NODE_ENV: testing
  APP_ENV: testing

jobs:
  validate:
    name: Validate testing deployment
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node.js version
        run: node --version

      - name: Run tests
        run: npm test

      - name: Check deployment syntax
        run: |
          node --check server.js
          node --check db.js
          node --check app.js
          node --check app-metadata.js
          node --check scripts/production-preflight.js
          node --check agent-avatars.js
          node --check ai.js
          node --check anthropic.js
          node --check voyage.js
          node --check semantic-memory.js
          node --check financial.js
          node --check excel-orderbook.js
          node --check monday-finance.js
          node --check project-intelligence.js
          node --check sarah.js
          node --check property.js
          node --check voice.js
          node --check meeting-intelligence.js
          node --check monday-operating-system.js
          node --check liam.js
          node --check james.js
          node --check briefing.js
          node --check microsoft.js
          node --check service-worker.js

  deploy:
    name: Deploy develop to Azure App Service testing
    runs-on: ubuntu-latest
    needs: validate
    environment: testing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Skip deployment when Azure testing settings are missing
        if: ${{ env.AZURE_WEBAPP_NAME == '' || env.AZURE_WEBAPP_PUBLISH_PROFILE == '' }}
        run: echo "Azure testing deployment skipped. Configure AZURE_TESTING_WEBAPP_NAME and AZURE_TESTING_PUBLISH_PROFILE."

      - name: Deploy to Azure App Service testing
        if: ${{ env.AZURE_WEBAPP_NAME != '' && env.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
