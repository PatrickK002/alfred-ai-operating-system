name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Node checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Node.js version
        run: node --version

      - name: Run tests
        run: npm test

      - name: Check server syntax
        run: node --check server.js

      - name: Check app metadata syntax
        run: node --check app-metadata.js

      - name: Check agent avatar metadata syntax
        run: node --check agent-avatars.js

      - name: Check database syntax
        run: node --check db.js

      - name: Check Microsoft integration syntax
        run: node --check microsoft.js

      - name: Check Anthropic reasoning syntax
        run: node --check anthropic.js

      - name: Check AI service syntax
        run: node --check ai.js

      - name: Check Voyage memory syntax
        run: node --check voyage.js

      - name: Check semantic memory syntax
        run: node --check semantic-memory.js

      - name: Check CFO finance syntax
        run: node --check financial.js

      - name: Check project intelligence syntax
        run: node --check project-intelligence.js

      - name: Check Sarah specialist syntax
        run: node --check sarah.js

      - name: Check Westbridge property syntax
        run: node --check property.js

      - name: Check voice command centre syntax
        run: node --check voice.js

      - name: Check meeting intelligence syntax
        run: node --check meeting-intelligence.js

      - name: Check order book importer syntax
        run: node --check excel-orderbook.js

      - name: Check Monday finance syntax
        run: node --check monday-finance.js

      - name: Check briefing intelligence syntax
        run: node --check briefing.js

      - name: Check frontend syntax
        run: node --check app.js

      - name: Check service worker syntax
        run: node --check service-worker.js
